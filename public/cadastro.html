<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastre-se - Conecta Vagas</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="logo">
        <h1><a href="index.html">Conecta Vagas</a></h1>
    </div>
    

    <div class="acoes">
      <a href="/login.html" class="btn-secundario">Login</a>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container cadastro-main">
    
    <div class="card cadastro-card">
      <h2>Criar Nova Conta</h2>
      
      <!-- CONTRATO JS: IDs de mensagem preservados -->
      <div id="mensagem-erro" class="alert alert-danger" style="display: none;"></div>
      <div id="mensagem-sucesso" class="alert alert-success" style="display: none;"></div>

      <!-- CONTRATO JS: ID form-cadastro preservado -->
      <form id="form-cadastro">
        
        <div class="form-group">
          <label for="nome">Nome Completo / Nome da Empresa</label>
          <!-- CONTRATO JS: ID nome preservado -->
          <input type="text" id="nome" placeholder="Ex: Maria Silva ou Tech Solutions" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <!-- CONTRATO JS: ID email preservado -->
          <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="form-group">
          <label for="role">Tipo de Conta</label>
          <!-- CONTRATO JS: ID role preservado -->
          <select id="role" required>
            <option value="" disabled selected>Selecione o perfil...</option>
            <option value="candidato">Candidato (Busco vagas de emprego)</option>
            <option value="empresa">Empresa (Quero anunciar vagas)</option>
          </select>
        </div>

        <!-- Layout de Grid via CSS Específico -->
        <div class="cadastro-grid">
          <div class="form-group">
            <label for="senha">Senha</label>
            <!-- CONTRATO JS: ID senha preservado -->
            <input type="password" id="senha" placeholder="Mín. 6 caracteres" required minlength="6">
          </div>

          <div class="form-group">
            <label for="confirmar-senha">Confirmar Senha</label>
            <!-- CONTRATO JS: ID confirmar-senha preservado -->
            <input type="password" id="confirmar-senha" placeholder="Repita a senha" required minlength="6">
          </div>
        </div>

        <button type="submit" class="btn-principal cadastro-btn">Finalizar Cadastro</button>
        
      </form>

      <!-- Link auxiliar -->
      <div class="cadastro-link-auxiliar">
        Já possui uma conta? <a href="/login.html">Faça login aqui</a>
      </div>
    </div>
  </main>

  <!-- RODAPÉ -->
  <footer>
    <p>© 2026 Conecta Vagas. Todos os direitos reservados.</p>
  </footer>

  <!-- SCRIPT -->
  <script type="module" src="/js/pages/cadastro.js"></script>
</body>
</html>
