<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Vaga - Conecta Vagas</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- CABECALHO -->
  <header>
    <div class="logo">
      <h1><a href="/">Conecta Vagas</a></h1>
    </div>
    <div class="acoes" id="nav-usuario">
      <a href="#" id="btn-logout" class="btn-perigo">Sair</a>
    </div>
  </header>

  <!-- CONTEUDO PRINCIPAL -->
  <main class="container">
    <div class="card" style="max-width: 800px; margin: 0 auto; padding: 2rem;">
      <h2 style="margin-bottom: 0.5rem;">Editar Vaga</h2>
      <p class="texto-mutado" style="margin-bottom: 2rem;">Altere as informações necessárias. Lembre-se: a vaga permanecerá com status "Encerrada" após a edição até que você a ative novamente no painel.</p>

      <div id="mensagem-erro" class="alert alert-danger" style="display: none; margin-bottom: 1rem;"></div>
      <div id="mensagem-sucesso" class="alert alert-success" style="display: none; margin-bottom: 1rem;"></div>

      <form id="form-editar-vaga" style="display: none;">
        
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="titulo">Título da Vaga *</label>
          <input type="text" id="titulo" name="titulo" class="form-control" required placeholder="Ex: Desenvolvedor Front-end Junior">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
          <div class="form-group">
            <label for="categoria_id">Categoria *</label>
            <select id="categoria_id" name="categoria_id" class="form-control" required>
              <option value="">Carregando categorias...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="cidade_id">Cidade *</label>
            <select id="cidade_id" name="cidade_id" class="form-control" required>
              <option value="">Carregando cidades...</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
          <div class="form-group">
            <label for="tipo_trabalho">Tipo de Trabalho *</label>
            <select id="tipo_trabalho" name="tipo_trabalho" class="form-control" required>
              <option value="presencial">Presencial</option>
              <option value="hibrido">Híbrido</option>
              <option value="remoto">Remoto</option>
            </select>
          </div>
          <div class="form-group">
            <label for="salario">Salário (Opcional - R$)</label>
            <input type="number" id="salario" name="salario" class="form-control" step="0.01" min="0" placeholder="Ex: 3500.00">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="descricao">Descrição da Vaga *</label>
          <textarea id="descricao" name="descricao" class="form-control" rows="5" required placeholder="Descreva as atividades e responsabilidades..."></textarea>
        </div>

        <div class="form-group" style="margin-bottom: 2rem;">
          <label for="requisitos">Requisitos (Opcional)</label>
          <textarea id="requisitos" name="requisitos" class="form-control" rows="4" placeholder="Liste os requisitos desejados..."></textarea>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end;">
          <a href="/minhas-vagas.html" class="btn-secundario">Cancelar</a>
          <button type="submit" class="btn-principal">Salvar Alterações</button>
        </div>
      </form>
    </div>
  </main>

  <!-- RODAPE -->
  <footer>
    <p>© 2026 Conecta Vagas. Todos os direitos reservados.</p>
  </footer>

  <!-- MODAL DE LOGOUT -->
  <div id="modal-logout" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3>Confirmar Saída</h3>
      <p>Deseja realmente encerrar sua sessão?</p>
      <div class="modal-actions">
        <button type="button" id="btn-cancelar-logout" class="btn-secundario">Cancelar</button>
        <button type="button" id="btn-confirmar-logout" class="btn-perigo">Sim, Sair</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/pages/editar-vaga.js"></script>
</body>
</html>
