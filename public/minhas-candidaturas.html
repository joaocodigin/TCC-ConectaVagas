<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Vagas - Conecta Vagas</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="logo">
     <h1><a href="index.html">Conecta Vagas</a></h1>
    </div>

    <!-- CONTRATO JS: ID nav-usuario preservado -->
    <div class="acoes" id="nav-usuario">
      <!-- CONTRATO JS: ID btn-logout preservado -->
      <a href="#" id="btn-logout" class="btn-perigo">Sair</a>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container">
    
    <!-- Cabeçalho da página do painel -->
    <div class="painel-empresa-header">
      <div class="painel-empresa-titulo">
        <h2>Gerenciamento de Vagas</h2>
        <p>Painel da Empresa - Acompanhe suas vagas publicadas e gerencie as candidaturas.</p>
      </div>
      <div class="painel-empresa-acoes">
        <!-- Botão auxiliar de atalho -->
        <a href="/criar-vaga.html" class="btn-principal">Anunciar Nova Vaga</a>
      </div>
    </div>

    <!-- CONTRATO JS: IDs de mensagem preservados -->
    <div id="mensagem-erro" class="alert alert-danger" style="display: none;"></div>
    <div id="mensagem-sucesso" class="alert alert-success" style="display: none;"></div>

    <!-- CONTRATO JS: ID lista-minhas-vagas preservado -->
    <!-- Utilizando classe semântica para layout flex-column -->
    <div id="lista-minhas-vagas" class="lista-minhas-vagas-container">
      
      <!-- Estado vazio/loading inicial -->
      <div class="card painel-loading">
        <p>Carregando suas vagas...</p>
      </div>

    </div>
    
  </main>

  <!-- RODAPÉ -->
  <footer>
    <p>© 2026 Conecta Vagas. Todos os direitos reservados.</p>
  </footer>

  <!-- SCRIPT -->
  <script type="module" src="/js/pages/minhas-vagas.js"></script>
</body>
</html>
