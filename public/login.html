<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Conecta Vagas</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="logo">
      <h1>Conecta Vagas</h1>
    </div>
   

    <div class="acoes">
      <a href="/cadastro.html" class="btn-secundario">Cadastrar-se</a>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container login-main">
    
    <div class="card login-card">
      <h2>Acessar Conta</h2>
      
      <!-- CONTRATO JS: ID mensagem-erro preservado -->
      <div id="mensagem-erro" class="alert alert-danger" style="display: none;"></div>

      <!-- CONTRATO JS: ID form-login preservado -->
      <form id="form-login">
        
        <div class="form-group">
          <label for="email">E-mail</label>
          <!-- CONTRATO JS: ID email preservado -->
          <input type="email" id="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <!-- CONTRATO JS: ID senha preservado -->
          <input type="password" id="senha" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn-principal login-btn">Entrar no Painel</button>
        
        <!-- Link auxiliar visual refatorado -->
        <div class="login-link-auxiliar">
          Ainda não tem uma conta? <a href="/cadastro.html">Cadastre-se aqui</a>
        </div>
      </form>

    </div>
  </main>

  <!-- RODAPÉ -->
  <footer>
    <p>© 2026 Conecta Vagas. Todos os direitos reservados.</p>
  </footer>

  <!-- SCRIPT -->
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
